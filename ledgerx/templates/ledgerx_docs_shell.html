<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LedgerX Docs</title>
<link rel="icon" href="/assets/ledgerx/images/ledgerx-favicon.svg">
<link rel="stylesheet" href="/assets/ledgerx/docs/docs.css?v={{ ledgerx_version }}">
</head>
<body>
<header class="top">
  <button class="icon-btn only-mobile" id="menu-btn" aria-label="menu">&#9776;</button>
  <a class="brand" href="#/"><img src="/assets/ledgerx/images/ledgerx-mark.svg" alt=""><span><b>LedgerX</b> <em data-i18n="docs">الدليل</em></span></a>
  <button class="search-btn" id="search-btn"><span data-i18n="search">بحث في الدليل</span><kbd>Ctrl K</kbd></button>
  <nav class="top-actions">
    <a class="app-link" href="/app" data-i18n="open_app">فتح النظام</a>
    <button class="icon-btn" id="lang-btn" title="Language">EN</button>
    <button class="icon-btn" id="theme-btn" title="Theme">&#9680;</button>
    <button class="icon-btn" id="print-btn" title="PDF">&#8681;</button>
  </nav>
</header>
<div class="layout">
  <aside class="side" id="side"><div id="tree"></div></aside>
  <div class="scrim" id="scrim"></div>
  <main class="main"><article id="article"></article><div id="pager"></div><footer class="foot">© LedgerX</footer></main>
  <aside class="toc" id="toc"></aside>
</div>
<div class="modal" id="modal" hidden><div class="box"><input id="q" autocomplete="off" placeholder="..."><div id="results"></div></div></div>
<script src="/assets/ledgerx/docs/structure.js?v={{ ledgerx_version }}"></script>
<script src="/assets/ledgerx/docs/content_ar.js?v={{ ledgerx_version }}"></script>
<script src="/assets/ledgerx/docs/content_en.js?v={{ ledgerx_version }}"></script>
<script src="/assets/ledgerx/docs/docs.js?v={{ ledgerx_version }}"></script>
</body>
</html>
