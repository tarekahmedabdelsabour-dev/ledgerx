[project]
name = "ledgerx"
authors = [
    { name = "LedgerX", email = "hello@ledgerx.local" }
]
description = "LedgerX - custom branding and interface layer for ERPNext (Arabic + English)"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# Stable target is Frappe/ERPNext 16 (version-16). 17 (develop) also works for testing:
# both use the same "Espresso" design tokens and the same branding settings fields.
[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<18.0.0"
